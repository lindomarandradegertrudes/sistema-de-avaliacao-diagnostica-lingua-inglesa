<!-- TDAs: edição (campos no editor de questionários), entregas e correção pela rubrica. Incluída em Professor.html -->
<style>
  .rubrica-edicao td { vertical-align: top; min-width: 150px; }
  .rubrica-edicao textarea { font-size: .85rem; min-height: 64px; }
  .tda-grade { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
  .tda-card h3 { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .tda-membro { display: flex; gap: 6px; align-items: center; padding: 4px 0; font-size: .9rem; border-top: 1px solid var(--borda); }
  .tda-membro .nome { flex: 1; }
  .tda-entrega { background: var(--fundo); border-radius: 8px; padding: 8px 10px; margin: 8px 0; font-size: .88rem; }
  .tda-entrega .trecho { white-space: pre-wrap; max-height: 5.5em; overflow: hidden; }
  .texto-tda-prof { background: var(--fundo); border-radius: 8px; padding: 10px 14px; line-height: 1.55; }
  .texto-tda-prof h2 { font-size: 1.3rem; margin: .5em 0 .25em; }
  .texto-tda-prof h3 { font-size: 1.08rem; margin: .45em 0 .2em; }
  .texto-tda-prof p { margin: 0 0 .45em; }
  .rub-grade { width: 100%; border-collapse: collapse; }
  .rub-grade th, .rub-grade td { border: 1px solid var(--borda); padding: 6px; font-size: .82rem; vertical-align: top; }
  .rub-grade td.opcao { cursor: pointer; }
  .rub-grade td.opcao:hover { background: var(--fundo); }
  .rub-grade td.sel { outline: 3px solid var(--primaria); outline-offset: -3px; background: var(--primaria-clara); font-weight: 600; }
  .rub-grade th.n4 { background: #1a7a5e; color: #fff; } .rub-grade th.n3 { background: #ffd700; }
  .rub-grade th.n2 { background: #ff8c00; color: #fff; } .rub-grade th.n1 { background: #e74c3c; color: #fff; }
  #tda-nota-previa { font-size: 1.1rem; font-weight: 700; }
  /* Revisão com o feedback detalhado: texto do aluno ao lado */
  .mt-corpo:not(.com-fb) > * + * { margin-top: 14px; }
  #modal-tda.com-fb { width: min(1280px, calc(100vw - 32px)) !important; }
  .mt-corpo.com-fb { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 16px; align-items: start; }
  .mt-corpo.com-fb #mt-entrega { position: sticky; top: 0; max-height: 70vh; overflow-y: auto; }
  @media (max-width: 860px) { .mt-corpo.com-fb { display: block; } .mt-corpo.com-fb #mt-entrega { position: static; max-height: none; } }
  .fb-bloco { border: 1px solid var(--borda); border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
  .fb-bloco h4 { margin: 0 0 6px; }
  .fb-item { display: grid; grid-template-columns: 1fr 1fr 1.4fr auto; gap: 6px; margin-bottom: 6px; }
  @media (max-width: 640px) { .fb-item { grid-template-columns: 1fr; } }
  .fb-hab { display: flex; gap: 8px; align-items: center; padding: 3px 0; font-weight: 400; }
  .fb-hab input[type=text] { flex: 1; }
  .fb-previa { background: var(--fundo); border-radius: 8px; padding: 12px 14px; margin-top: 10px; }
  .fb-previa mark { background: #d3f9d8; padding: 0 2px; border-radius: 3px; }
</style>

<!-- Tela de entregas e correção -->
<div id="q-tda" class="pilha" hidden>
  <div class="linha">
    <button class="btn" data-voltar>← Voltar</button>
    <h2 style="margin:0" id="tda-titulo"></h2>
    <span class="espaco"></span>
    <button class="btn" id="tda-imprimir">Imprimir TDA</button>
    <button class="btn" id="tda-imprimir-rubrica">Imprimir rubrica</button>
  </div>
  <div class="chips" id="tda-turmas"></div>
  <p class="suave pequeno" id="tda-info" style="margin:0"></p>
  <div id="tda-lista" class="tda-grade"></div>
  <div id="tda-ia" class="cartao" style="margin-top:14px" hidden></div>
  <div id="tda-rec" class="cartao" style="margin-top:14px"></div>
</div>

<dialog id="modal-tda" style="width:min(900px, calc(100vw - 32px))">
  <div class="linha" style="margin-bottom:8px">
    <h2 style="margin:0" id="mt-titulo">Corrigir</h2>
    <span class="espaco"></span>
    <button class="btn" type="button" data-fechar>Fechar</button>
  </div>
  <div style="max-height:72vh;overflow-y:auto" class="mt-corpo" id="mt-corpo">
    <div id="mt-entrega"></div>
    <div class="pilha">
    <div>
      <h3>Rubrica <span class="suave pequeno">— clique no nível de cada critério</span></h3>
      <div class="tabela-rolagem"><table class="rub-grade" id="mt-rubrica"></table></div>
    </div>
    <div class="campo"><label for="mt-comentario">Comentário para o aluno (feedback)</label>
      <textarea id="mt-comentario" rows="3" placeholder="Ex.: Great job on the vocabulary! Next time, check the verb tenses in paragraph 2."></textarea></div>
    <div id="mt-fb"></div>
    <div id="mt-alvos"></div>
    <div class="linha" style="flex-wrap:wrap;gap:8px">
      <span id="tda-nota-previa"></span>
      <span class="espaco"></span>
      <button class="btn" id="mt-previa" hidden>👁 Como o aluno verá</button>
      <button class="btn perigo" id="mt-descartar" hidden>Descartar rascunho</button>
      <button class="btn perigo" id="mt-apagar" hidden>Apagar correção</button>
      <button class="btn primario" id="mt-salvar">Salvar correção</button>
    </div>
    <div id="mt-previa-caixa"></div>
    </div>
  </div>
</dialog>

<script>
  // ---------- Texto formatado das TDAs: mesmo filtro do servidor (só negrito, títulos, listas, alinhamento e cor) ----------
  const TAGS_TDA_PROF = { p: 1, br: 1, b: 1, strong: 1, i: 1, em: 1, u: 1, h2: 1, h3: 1, ul: 1, ol: 1, li: 1, div: 1, span: 1, font: 1 };
  function limparHtmlTdaProf(html) {
    const s = String(html || '').replace(/<!--[\s\S]*?-->/g, '')
      .replace(/<(script|style|iframe|object|embed|svg|math|template|textarea|select)\b[\s\S]*?<\/\1\s*>/gi, '');
    return s.split(/(<[^<>]*>)/).map((parte) => {
      const m = parte.match(/^<(\/?)([a-zA-Z][a-zA-Z0-9]*)(\s[^>]*|\/)?>$/);
      if (!m) return parte.replace(/</g, '&lt;').replace(/>/g, '&gt;');
      let nome = m[2].toLowerCase();
      if (!TAGS_TDA_PROF[nome]) return '';
      if (nome === 'font') nome = 'span';
      if (m[1]) return '</' + nome + '>';
      if (nome === 'br') return '<br>';
      const attrs = m[3] || '';
      const estilo = [];
      const st = attrs.match(/style\s*=\s*("([^"]*)"|'([^']*)')/i);
      const css = st ? (st[2] || st[3] || '') : '';
      let cor = (css.match(/(?:^|;)\s*color\s*:\s*([^;]+)/i) || [])[1] || (attrs.match(/\bcolor\s*=\s*["']?([#\w(),\s]+?)["'\s>]/i) || [])[1] || '';
      cor = cor.trim();
      if (/^#[0-9a-f]{3,8}$/i.test(cor) || /^rgb\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*\)$/i.test(cor)) estilo.push('color:' + cor);
      const al = ((css.match(/text-align\s*:\s*([a-z]+)/i) || [])[1] || (attrs.match(/\balign\s*=\s*["']?([a-z]+)/i) || [])[1] || '').toLowerCase();
      if (['left', 'center', 'right', 'justify'].indexOf(al) !== -1) estilo.push('text-align:' + al);
      if (/font-weight\s*:\s*(bold|[6-9]00)/i.test(css)) estilo.push('font-weight:bold');
      if (/font-style\s*:\s*italic/i.test(css)) estilo.push('font-style:italic');
      if (/text-decoration(-line)?\s*:[^;]*underline/i.test(css)) estilo.push('text-decoration:underline');
      return '<' + nome + (estilo.length ? ' style="' + estilo.join(';') + '"' : '') + '>';
    }).join('');
  }
  function textoPuroTdaProf(html) {
    return String(html || '').replace(/<(br|\/p|\/div|\/h2|\/h3|\/li)\s*\/?>/gi, '\n').replace(/<[^>]*>/g, '')
      .replace(/&nbsp;/g, ' ').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&amp;/g, '&').trim();
  }
  /** Conteúdo da entrega para mostrar: texto formatado (filtrado) ou texto simples das entregas antigas. */
  function conteudoEntregaTdaProf(e) {
    return e.formato === 'html' ? limparHtmlTdaProf(e.texto) : esc(e.texto).replace(/\n/g, '<br>');
  }
  function palavrasTdaProf(texto) { const t = String(texto || '').trim(); return t ? t.split(/\s+/).length : 0; }

  const tdaEstado = { dados: null, turma: '', unidade: null, niveis: [] };
  const NIVEL_ROTULO = { 4: '4 – Excelente', 3: '3 – Satisfatório', 2: '2 – Em desenvolvimento', 1: '1 – Insuficiente' };

  // ---------- Editor (campos da TDA dentro do editor de questionários) ----------
  function tdaVazia() {
    return { modo: 'individual', situacao: '', produto: '', tarefas: [], criterios: [],
      rubrica: [{ criterio: '', n4: '', n3: '', n2: '', n1: '' }] };
  }

  function preencherTdaEditor(t) {
    const tda = Object.assign(tdaVazia(), t || {});
    $('ed-tda-modo').value = tda.modo === 'grupo' ? 'grupo' : 'individual';
    $('ed-tda-canva').checked = tda.canva !== false;
    $('ed-tda-situacao').value = tda.situacao || '';
    $('ed-tda-produto').value = tda.produto || '';
    $('ed-tda-tarefas').value = (tda.tarefas || []).join('\n');
    $('ed-tda-criterios').value = (tda.criterios || []).join('\n');
    renderRubricaEditor(tda.rubrica && tda.rubrica.length ? tda.rubrica : tdaVazia().rubrica);
    renderHabilidadesTda(tda.habilidades || []);
    $('ed-tda-obsia').value = tda.obsIa || '';
    $('ed-tda-corrigida').checked = tda.mostrarCorrigida === true;
  }

  // ---------- Habilidades da TDA (base da recuperação) ----------
  let catalogoHabTda = null;
  async function renderHabilidadesTda(marcadas) {
    const caixa = $('ed-tda-habilidades');
    if (!catalogoHabTda) {
      caixa.innerHTML = '<span class="suave">Carregando…</span>';
      try { catalogoHabTda = await chamar('profHabilidadesTda'); } catch (e) { caixa.textContent = e.message; return; }
    }
    const lista = catalogoHabTda[$('ed-serie').value] || [];
    caixa.innerHTML = lista.length ? lista.map((h) => `
      <label style="display:inline-flex;gap:6px;align-items:center;font-weight:400;margin:2px 14px 2px 0">
        <input type="checkbox" data-hab-tda="${esc(h.id)}" style="width:auto" ${marcadas.indexOf(h.id) !== -1 ? 'checked' : ''}>
        ${esc(h.nome)} <span class="suave">${esc(h.codigo || '')}</span></label>`).join('')
      : '<span class="suave">Escolha a série para ver as habilidades.</span>';
  }

  function lerHabilidadesTda() {
    return [...document.querySelectorAll('#ed-tda-habilidades [data-hab-tda]:checked')].map((c) => c.dataset.habTda);
  }

  function renderRubricaEditor(rubrica) {
    const bloqueada = estado.edicao && estado.edicao.respostas > 0;
    const dis = bloqueada ? 'disabled' : '';
    $('ed-tda-rubrica').innerHTML = rubrica.map((r) => `<tr>
      ${['criterio', 'n4', 'n3', 'n2', 'n1'].map((c) => `<td><textarea data-rub="${c}" ${dis}>${esc(r[c] || '')}</textarea>${c === 'criterio'
        ? `<label class="pequeno" style="display:flex;gap:6px;align-items:flex-start;font-weight:400;margin-top:4px" title="A correção com IA não avalia este critério: você marca o nível na revisão.">
            <input type="checkbox" data-rub-prof style="width:auto;margin-top:2px" ${r.soProfessor ? 'checked' : ''}> 👩‍🏫 só o professor avalia</label>` : ''}</td>`).join('')}
      <td><button class="btn mini perigo" data-rub-remover ${dis}>×</button></td></tr>`).join('');
    $('ed-tda-add').disabled = bloqueada;
  }

  function lerRubricaEditor() {
    return [...$('ed-tda-rubrica').querySelectorAll('tr')].map((tr) => {
      const r = {};
      tr.querySelectorAll('[data-rub]').forEach((el) => (r[el.dataset.rub] = el.value));
      r.soProfessor = !!(tr.querySelector('[data-rub-prof]') || {}).checked;
      return r;
    });
  }

  function lerTdaEditor() {
    const linhas = (id) => $(id).value.split('\n').map((s) => s.trim()).filter(Boolean);
    return {
      modo: $('ed-tda-modo').value,
      canva: $('ed-tda-canva').checked,
      situacao: $('ed-tda-situacao').value,
      produto: $('ed-tda-produto').value,
      tarefas: linhas('ed-tda-tarefas'),
      criterios: linhas('ed-tda-criterios'),
      rubrica: lerRubricaEditor().filter((r) => r.criterio.trim()),
      habilidades: lerHabilidadesTda(),
      obsIa: $('ed-tda-obsia').value,
      mostrarCorrigida: $('ed-tda-corrigida').checked,
    };
  }

  function aplicarTipoEditor() {
    const tda = $('ed-tipo').value === 'tda';
    document.querySelectorAll('#q-editor .so-questionario').forEach((el) => (el.hidden = tda));
    document.querySelectorAll('#q-editor .so-tda').forEach((el) => (el.hidden = !tda));
    $('ed-importar-q').textContent = tda ? 'Colar TDA (JSON)' : 'Colar questões (JSON)';
    $('ed-imprimir').textContent = tda ? 'Imprimir TDA' : 'Imprimir prova';
    $('ed-bloqueado').textContent = tda
      ? 'Esta TDA já tem correções: a rubrica e a série não podem mais ser alteradas.'
      : 'Este questionário já tem respostas: as questões e a série não podem mais ser alteradas.';
    $('ed-conteudo').placeholder = tda
      ? 'Opcional: conteúdo trabalhado no mês (aparece só para você).'
      : 'Cole aqui o conteúdo/expectativas trabalhados (ex.: Simple past – verbos regulares; leitura de biografias; preposições in/on/at).';
  }

  // ---------- Impressão da TDA (aluno) e da rubrica (professor) ----------
  function imprimirTda(q, rubrica) {
    const t = q.tda;
    const lista = (itens, ordenada) => `<${ordenada ? 'ol' : 'ul'} style="margin:4px 0 0 20px">${itens.map((i) => `<li>${esc(i)}</li>`).join('')}</${ordenada ? 'ol' : 'ul'}>`;
    const titulo = esc(q.titulo || 'TDA');
    let html;
    if (rubrica) {
      html = `<h2>Rubrica de avaliação – ${titulo} (${esc(q.serie)} ano)</h2>
        <table style="width:100%"><tr><th>Critério</th><th>4 – Excelente</th><th>3 – Satisfatório</th><th>2 – Em desenvolvimento</th><th>1 – Insuficiente</th></tr>
        ${t.rubrica.map((r) => `<tr><td style="text-align:left"><strong>${esc(r.criterio)}</strong></td>${['n4', 'n3', 'n2', 'n1'].map((c) => `<td style="text-align:left">${esc(r[c])}</td>`).join('')}</tr>`).join('')}</table>
        <p><strong>Exclusivo para o/a professor/a.</strong> Nota = soma dos níveis ÷ ${4 * t.rubrica.length}.</p>`;
    } else {
      html = `<div class="cab"><div><strong>${titulo}</strong> – Língua Inglesa – ${esc(q.serie)} ano${t.modo === 'grupo' ? ' – atividade em grupo' : ''}</div>
          <div>Nome: ____________________________________________ Turma: ________ Data: ___/___/______</div></div>
        <h3>🌍 Situação-problema</h3><p style="white-space:pre-wrap">${esc(t.situacao)}</p>
        <h3>🎯 Produto final</h3><p style="white-space:pre-wrap">${esc(t.produto)}</p>
        ${t.tarefas.length ? `<h3>📝 Tarefas de apoio</h3>${lista(t.tarefas, true)}` : ''}
        ${t.criterios.length ? `<h3>✅ Critérios de avaliação</h3>${lista(t.criterios, false)}` : ''}`;
    }
    $('impressao').innerHTML = html;
    document.body.classList.add('imprimindo');
    setTimeout(() => { window.print(); document.body.classList.remove('imprimindo'); }, 50);
  }

  // ---------- Tela de entregas ----------
  async function abrirTda(id) {
    tdaEstado.dados = await chamar('profTdaResultados', id);
    if (!tdaEstado.dados.turmas.includes(tdaEstado.turma)) tdaEstado.turma = tdaEstado.dados.turmas[0];
    renderTda();
    telaQuestionarios('q-tda');
  }

  /** Monta as "unidades" de correção da turma: alunos (modo individual) ou grupos (modo grupo). */
  function unidadesDaTurma(turma) {
    const d = tdaEstado.dados;
    const alunos = d.alunos.filter((a) => a.turma === turma);
    const porEmail = Object.fromEntries(alunos.map((a) => [a.email, a]));
    const entregas = d.entregas.filter((e) => e.turma === turma);
    const unidades = [];
    const usados = new Set();
    const adicionar = (titulo, emails, entrega) => {
      const membros = emails.filter((e) => porEmail[e] && !usados.has(e));
      if (!membros.length) return;
      membros.forEach((e) => usados.add(e));
      unidades.push({ titulo, membros: membros.map((e) => porEmail[e]), entrega });
    };
    entregas.forEach((e) => adicionar(e.grupo != null ? 'Grupo ' + e.grupo : porEmail[e.membros[0].email]?.nome || 'Entrega',
      e.membros.map((m) => m.email), e));
    if (d.questionario.tda.modo === 'grupo') {
      (d.grupos[turma] || []).forEach((g) => adicionar('Grupo ' + g.numero, g.membros, null));
    }
    alunos.sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR')).forEach((a) => adicionar(a.nome, [a.email], null));
    return unidades.sort((a, b) => a.titulo.localeCompare(b.titulo, 'pt-BR', { numeric: true }));
  }

  function renderTda() {
    const d = tdaEstado.dados;
    const q = d.questionario;
    $('tda-titulo').textContent = `${q.titulo} · ${q.serie} ano · ${q.tda.modo === 'grupo' ? 'em grupo' : 'individual'}`;
    $('tda-turmas').innerHTML = d.turmas.map((t) => {
      const alunos = d.alunos.filter((a) => a.turma === t);
      const corrigidos = alunos.filter((a) => a.correcao).length;
      return `<button class="btn ${t === tdaEstado.turma ? 'ativa' : ''}" data-turma="${esc(t)}">${esc(t)} <span class="pequeno">${corrigidos}/${alunos.length}</span></button>`;
    }).join('');
    const semGrupos = q.tda.modo === 'grupo' && !(d.grupos[tdaEstado.turma] || []).length;
    $('tda-info').textContent = (q.status !== 'aberto' ? 'Esta TDA não está liberada para entregas online. ' : '') +
      (semGrupos ? 'Esta turma ainda não tem grupos: a TDA aparece por aluno. ' : '') +
      'Trabalhos feitos no papel também podem ser corrigidos aqui, mesmo sem entrega online.';

    const unidades = unidadesDaTurma(tdaEstado.turma);
    $('tda-lista').innerHTML = unidades.length ? unidades.map((u, i) => {
      const e = u.entrega;
      const corrigidos = u.membros.filter((m) => m.correcao).length;
      const selo = corrigidos === u.membros.length ? '<span class="selo aberto">Corrigida</span>'
        : corrigidos ? `<span class="selo rascunho">${corrigidos}/${u.membros.length} corrigidos</span>`
        : e ? '<span class="selo Intermediário">Entregue</span>' : '<span class="selo encerrado">Sem entrega online</span>';
      return `<div class="cartao tda-card">
        <h3>${esc(u.titulo)} <span class="espaco"></span>${selo}</h3>
        ${e ? `<div class="tda-entrega">
            <div class="suave pequeno">Enviado por ${esc(e.enviadoPor)} · ${esc(e.atualizado_em)}</div>
            ${e.titulo ? `<div><strong>${esc(e.titulo)}</strong></div>` : ''}
            ${e.texto ? `<div class="trecho">${esc(e.formato === 'html' ? textoPuroTdaProf(e.texto) : e.texto)}</div>` : ''}
            ${e.link ? `<div>🔗 <a href="${esc(e.link)}" target="_blank" rel="noopener">abrir link</a></div>` : ''}
            ${e.anexos.length ? `<div>📎 ${e.anexos.length} anexo(s)</div>` : ''}
          </div>` : ''}
        ${u.membros.map((m) => `<div class="tda-membro"><span class="nome">${esc(m.nome)}</span>
          ${textoSaidas(e && e.saidas && e.saidas[m.email], false)}
          ${m.correcao ? `<strong>${m.correcao.percentual}%</strong>` : '<span class="suave pequeno">—</span>'}
          ${u.membros.length > 1 ? `<button class="btn mini" data-ajustar="${i}" data-email="${esc(m.email)}">Ajustar</button>` : ''}</div>`).join('')}
        <div class="rodape-modal" style="margin-top:10px"><button class="btn primario mini" data-corrigir="${i}">${corrigidos ? 'Rever correção' : 'Corrigir'}</button></div>
      </div>`;
    }).join('') : '<div class="cartao vazio">Nenhum aluno cadastrado nesta turma.</div>';
    tdaEstado.unidades = unidades;
    renderCorrecaoIa();
    renderRecuperacao();
  }

  // ---------- 🤖 Correção com IA (opcional): pedido em lotes para o claude.ai e rascunhos ----------
  const iaTda = { lotes: [], aberto: false };

  function renderCorrecaoIa() {
    const d = tdaEstado.dados;
    const ia = d.correcaoIa;
    $('tda-ia').hidden = !ia;
    if (!ia) return;
    const alunos = d.alunos.filter((a) => a.turma === tdaEstado.turma && !a.correcao).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
    const comTexto = alunos.filter((a) => ia.comTexto[a.email]);
    const rascunhos = alunos.filter((a) => ia.rascunhos[a.email]).length;
    const linha = (a) => {
      const pode = ia.comTexto[a.email];
      const sit = ia.rascunhos[a.email] ? `<span class="selo Intermediário">🤖 rascunho pronto</span> <button class="btn mini" data-ia-ver="${esc(a.email)}">👁 ver</button>`
        : pode ? '<span class="suave">sem rascunho</span>'

  async function copiarTextoTda(texto, campo) {
    try { await navigator.clipboard.writeText(texto); return true; } catch (e) { /* sem permissão: usa a seleção */ }
    campo.hidden = false; campo.value = texto; campo.focus(); campo.select();
    try { return document.execCommand('copy'); } catch (e) { return false; }
  }

  /** Destaca, na versão corrigida, as palavras que mudaram em relação ao texto do aluno (diferença por palavras). */
  function destacarMudancas(original, corrigida) {
    const a = String(original || '').split(/(\s+)/), b = String(corrigida || '').split(/(\s+)/);
    const pa = a.filter((_, i) => i % 2 === 0), pb = b.filter((_, i) => i % 2 === 0);
    const limpa = (w) => w.toLowerCase().replace(/[^a-z0-9'à-ÿ]/g, '');
    const n = pa.length, m = pb.length;
    if (n * m > 400000) return esc(corrigida);
    const lcs = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      lcs[i][j] = limpa(pa[i]) === limpa(pb[j]) ? lcs[i + 1][j + 1] + 1 : Math.max(lcs[i + 1][j], lcs[i][j + 1]);
    const igual = new Array(m).fill(false);
    for (let i = 0, j = 0; i < n && j < m;) {
      if (limpa(pa[i]) === limpa(pb[j])) { igual[j] = true; i++; j++; } else if (lcs[i + 1][j] >= lcs[i][j + 1]) i++; else j++;
    }
    return b.map((t, k) => k % 2 ? esc(t) : (igual[k / 2] || !t ? esc(t) : `<mark>${esc(t)}</mark>`)).join('');
  }

    return `<div class="fb-previa"><p class="suave pequeno" style="margin:0 0 6px">👁 Prévia: é assim que o aluno vai ver o feedback na TDA corrigida.</p>

      ${fb.pontos_fortes.length ? `<p><strong>💪 Pontos fortes</strong><br>${fb.pontos_fortes.map(esc).join('<br>')}</p>` : ''}
      ${fb.melhorar.filter((m) => m.trecho || m.correcao).length ? `<p style="margin-bottom:2px"><strong>🎯 Abaixo seguem algumas correções:</strong></p>
        <ul style="margin-top:0;padding-left:20px">${fb.melhorar.filter((m) => m.trecho || m.correcao).map((m) => `<li>"${esc(m.trecho)}" → <strong>${esc(m.correcao)}</strong>${m.explicacao ? ' <span class="suave">' + esc(m.explicacao) + '</span>' : ''}</li>`).join('')}</ul>` : ''}
      ${fb.estudar.length ? `<p style="margin-bottom:2px"><strong>📚 O que estudar</strong></p>${fb.estudar.map((s) => `<div class="linha" style="gap:8px;margin:4px 0">
        <span style="flex:1">${esc(nomes[s.habilidade] || s.habilidade)}${s.motivo ? ' <span class="suave">· ' + esc(s.motivo) + '</span>' : ''}</span>
        <span class="btn mini">📖 Abrir a ficha</span></div>`).join('')}<div style="margin-top:6px"><span class="btn mini">💪 Ir para o Meu reforço</span></div>` : ''}
      ${fb.versao_corrigida && ia.mostrarCorrigida ? `<p style="margin-bottom:2px"><strong>✍️ Seu texto ficaria melhor assim:</strong> <span class="suave pequeno">(em verde, o que mudou)</span></p>
        <div style="white-space:pre-wrap;background:#fff;border-radius:6px;padding:8px 10px">${destacarMudancas(original, fb.versao_corrigida)}</div>` : ''}
    </div>`;
  }

  function renderRubricaCorrecao() {
    const rub = tdaEstado.dados.questionario.tda.rubrica;
    $('mt-rubrica').innerHTML = `<tr><th>Critério</th><th class="n4">4 – Excelente</th><th class="n3">3 – Satisfatório</th><th class="n2">2 – Em desenvolvimento</th><th class="n1">1 – Insuficiente</th></tr>` +
      rub.map((r, i) => `<tr><td><strong>${esc(r.criterio)}</strong></td>${[4, 3, 2, 1].map((n) =>
        `<td class="opcao ${tdaEstado.niveis[i] === n ? 'sel' : ''}" data-crit="${i}" data-nivel="${n}">${esc(r['n' + n])}</td>`).join('')}</tr>`).join('');
    const soma = tdaEstado.niveis.reduce((s, v) => s + v, 0);
    const completos = tdaEstado.niveis.every((v) => v > 0);
    $('tda-nota-previa').textContent = completos
      ? `Nota: ${soma}/${4 * rub.length} = ${Math.round((soma / (4 * rub.length)) * 1000) / 10}%`
      : `Marque os ${rub.length} critérios`;
  }

  function configurarTda() {
    $('ed-tipo').addEventListener('change', aplicarTipoEditor);
    $('ed-tda-add').addEventListener('click', () => {
      renderRubricaEditor([...lerRubricaEditor(), { criterio: '', n4: '', n3: '', n2: '', n1: '' }]);
    });
    $('ed-tda-rubrica').addEventListener('click', (ev) => {
      if (!ev.target.matches('[data-rub-remover]')) return;
      ev.target.closest('tr').remove();
      if (!$('ed-tda-rubrica').children.length) renderRubricaEditor(tdaVazia().rubrica);
    });

    $('tda-turmas').addEventListener('click', (ev) => {
      const b = ev.target.closest('button[data-turma]');
      if (!b) return;
      tdaEstado.turma = b.dataset.turma;
      renderTda();
    });
    $('tda-lista').addEventListener('click', (ev) => {
      const b = ev.target.closest('button');
      if (!b) return;
      if (b.dataset.corrigir !== undefined) abrirCorrecao(tdaEstado.unidades[Number(b.dataset.corrigir)]);
      if (b.dataset.ajustar !== undefined) abrirCorrecao(tdaEstado.unidades[Number(b.dataset.ajustar)], b.dataset.email);
    });
    $('tda-ia').addEventListener('change', (ev) => {
      if (ev.target.id === 'ia-todos') document.querySelectorAll('#tda-ia [data-ia-aluno]:not(:disabled)').forEach((c) => (c.checked = ev.target.checked));
    });
    $('tda-ia').addEventListener('click', async (ev) => {
      const id = tdaEstado.dados.questionario.id;
      const ver = ev.target.closest('[data-ia-ver]');
      if (ver) {
        const email = ver.dataset.iaVer;
        const tr = document.querySelector(`#tda-ia tr[data-ia-previa="${CSS.escape(email)}"]`);
        if (!tr.hidden) { tr.hidden = true; return; }
        comBotao(ver, async () => { tr.children[1].innerHTML = htmlRascunhoIa(await chamar('profVerRascunhoIa', id, email)); tr.hidden = false; });
        return;
      }
      const lote = ev.target.closest('[data-ia-lote]');
      if (lote) {
        const emails = iaTda.lotes[Number(lote.dataset.iaLote)];
        comBotao(lote, async () => {
          const texto = await chamar('profPedidoCorrecaoIa', id, emails);
          const ok = await copiarTextoTda(texto, $('ia-pedido'));
          lote.textContent = '✔ ' + lote.textContent.replace(/^✔ /, '');
          avisar(ok ? 'Pedido copiado. Cole numa conversa NOVA do claude.ai (Ctrl+V) e depois cole a resposta aqui.' : 'Selecione o texto do pedido e copie com Ctrl+C.');
        });
        return;
      }
      const b = ev.target.closest('button[data-ia-acao]');
      if (!b) return;
      const acao = b.dataset.iaAcao;
      if (acao === 'abrir') { iaTda.aberto = !iaTda.aberto; renderCorrecaoIa(); return; }
      if (acao === 'lotes') {
        const emails = [...document.querySelectorAll('#tda-ia [data-ia-aluno]:checked')].map((c) => c.dataset.iaAluno);
        if (!emails.length) { avisar('Marque pelo menos um aluno com texto.', true); return; }
        const n = tdaEstado.dados.correcaoIa.lote;
        iaTda.lotes = [];
        for (let i = 0; i < emails.length; i += n) iaTda.lotes.push(emails.slice(i, i + n));
        $('ia-lotes').innerHTML = iaTda.lotes.map((l, i) => `<button class="btn mini" data-ia-lote="${i}">📋 Copiar lote ${i + 1} (${l.length})</button>`).join('') +
          '<span class="suave pequeno">Um lote por conversa do claude.ai; importe a resposta de cada lote.</span>';
        return;
      }
      if (acao === 'importar') {
        const texto = $('ia-resposta').value.trim();
        if (!texto) { avisar('Cole a resposta do claude.ai no campo.', true); return; }
        comBotao(b, async () => {
          const r = await chamar('profImportarCorrecaoIa', id, texto);
          const lotes = iaTda.lotes, lotesHtml = $('ia-lotes') ? $('ia-lotes').innerHTML : '';
          tdaEstado.dados = r.dados;
          renderTda();
          iaTda.lotes = lotes;
          if ($('ia-lotes')) $('ia-lotes').innerHTML = lotesHtml;
          $('ia-avisos').innerHTML = `<p>✅ ${r.importados} rascunho(s) importado(s).</p>` + (r.avisos.length ? `<ul>${r.avisos.map((a) => `<li>⚠️ ${esc(a)}</li>`).join('')}</ul>` : '');
          avisar(r.importados + ' rascunho(s) importado(s). Confira com 👁 ver.');
        });
      }
    });
    $('tda-rec').addEventListener('change', (ev) => {
      if (ev.target.id === 'rec-todos') document.querySelectorAll('#tda-rec [data-rec]').forEach((c) => (c.checked = ev.target.checked));
    });
    $('tda-rec').addEventListener('click', (ev) => {
      const b = ev.target.closest('button[data-rec-acao]');
      if (!b) return;
      const id = tdaEstado.dados.questionario.id;
      const acao = b.dataset.recAcao;
      if (['pedido', 'ver', 'importar', 'apagar-pacote'].indexOf(acao) !== -1) { acaoPacoteRec(acao, b, id); return; }
      const emails = [...document.querySelectorAll('#tda-rec [data-rec]:checked')].map((c) => c.dataset.rec);
      if (acao !== 'atualizar' && !emails.length) { avisar('Marque pelo menos um aluno.', true); return; }
      if (acao === 'tirar' && !confirm('Tirar a indicação dos alunos marcados?')) return;
      comBotao(b, async () => {
        tdaEstado.dados = acao === 'indicar' ? await chamar('profIndicarRecuperacao', id, emails, true)
          : acao === 'tirar' ? await chamar('profIndicarRecuperacao', id, emails, false)
          : acao === 'liberar' ? await chamar('profLiberarRecuperacao', id, emails)
          : acao === 'encerrar' ? await chamar('profEncerrarRecuperacao', id, emails)
          : await chamar('profTdaResultados', id);
        renderTda();
        if (acao === 'liberar') avisar('Recuperação liberada por 1 hora para ' + emails.length + ' aluno(s).');
        if (acao === 'encerrar') avisar('Liberação encerrada.');
      });
    });
    async function acaoPacoteRec(acao, b, id) {
      if (acao === 'pedido') {
        comBotao(b, async () => {
          const texto = await chamar('profPedidoRecuperacao', id);
          const campo = $('rec-pedido');
          campo.value = texto;
          let ok = false;
          try { await navigator.clipboard.writeText(texto); ok = true; } catch (e) { /* sem permissão: usa a seleção */ }
          if (!ok) { campo.hidden = false; campo.focus(); campo.select(); try { ok = document.execCommand('copy'); } catch (e) { ok = false; } }
          avisar(ok ? 'Pedido copiado. Cole no claude.ai (Ctrl+V) e depois cole a resposta aqui.' : 'Selecione o texto do pedido e copie com Ctrl+C.');
        });
      } else if (acao === 'importar') {
        const texto = $('rec-resposta').value.trim();
        if (!texto) { avisar('Cole a resposta do claude.ai no campo.', true); return; }
        if (tdaEstado.dados.pacoteRec && !confirm('Substituir o pacote atual? Quem já começou as atividades continua com as questões sorteadas antes.')) return;
        comBotao(b, async () => {
          tdaEstado.dados = await chamar('profImportarPacoteRec', id, texto);
          renderTda();
          avisar('Pacote importado: ' + tdaEstado.dados.pacoteRec.questoes + ' questões.');
        });
      } else if (acao === 'apagar-pacote') {
        if (!confirm('Apagar o pacote de recuperação desta TDA? Quem já começou as atividades continua com as questões sorteadas.')) return;
        comBotao(b, async () => { tdaEstado.dados = await chamar('profApagarPacoteRec', id); renderTda(); });
      } else if (acao === 'ver') {
        const caixa = $('rec-pacote-lista');
        if (caixa.innerHTML) { caixa.innerHTML = ''; return; }
        comBotao(b, async () => {
          const itens = await chamar('profVerPacoteRec', id);
          caixa.innerHTML = '<ol style="margin:10px 0 0;padding-left:20px">' + itens.map((x) => `<li style="margin-bottom:10px">
            <span class="suave">${esc(x.nome)} · ${esc(x.tipo)}</span>
            ${x.contexto ? `<div class="suave" style="white-space:pre-wrap">${esc(x.contexto)}</div>` : ''}
            <div><strong>${esc(x.enunciado)}</strong></div>
            <div>${x.opcoes.map((o, k) => k === x.certa ? `<strong style="color:#2b8a3e">✔ ${esc(o)}</strong>` : esc(o)).join(' · ')}</div>
            ${x.porque ? `<div class="suave">💡 ${esc(x.porque)}</div>` : ''}</li>`).join('') + '</ol>';
        });
      }
    }
    $('ed-serie').addEventListener('change', () => {
      if ($('ed-tipo').value === 'tda') renderHabilidadesTda(lerHabilidadesTda());
    });
    $('ed-tda-habilidades').addEventListener('change', (ev) => {
      if (ev.target.matches('[data-hab-tda]') && ev.target.checked && lerHabilidadesTda().length > 3) {
        ev.target.checked = false;
        avisar('Marque no máximo 3 habilidades.', true);
      }
    });
    $('tda-imprimir').addEventListener('click', () => imprimirTda(tdaEstado.dados.questionario, false));
    $('tda-imprimir-rubrica').addEventListener('click', () => imprimirTda(tdaEstado.dados.questionario, true));

    $('mt-rubrica').addEventListener('click', (ev) => {
      const td = ev.target.closest('td[data-crit]');
      if (!td) return;
      tdaEstado.niveis[Number(td.dataset.crit)] = Number(td.dataset.nivel);
      renderRubricaCorrecao();
    });
    $('mt-salvar').addEventListener('click', (ev) => {
      const u = tdaEstado.unidade;
      const marcados = [...document.querySelectorAll('#mt-alvos [data-alvo]')];
      const emails = marcados.length ? marcados.filter((c) => c.checked).map((c) => c.dataset.alvo) : u.alvos.map((m) => m.email);
      if (!emails.length) { avisar('Marque pelo menos um aluno.', true); return; }
      if (!tdaEstado.niveis.every((v) => v > 0)) { avisar('Marque um nível em todos os critérios.', true); return; }
      comBotao(ev.target, async () => {
        const fb = lerFeedbackCorrecao();
        const feedback = fb ? { porques: fb.porques, pontos_fortes: fb.pontos_fortes, melhorar: fb.melhorar, estudar: fb.estudar, versao_corrigida: fb.versao_corrigida } : null;
        tdaEstado.dados = await chamar('profCorrigirTda', tdaEstado.dados.questionario.id, emails, tdaEstado.niveis, $('mt-comentario').value, feedback);
        $('modal-tda').close();
        renderTda();
        estado.alunos = await chamar('profListarAlunos');
        renderAlunos();
        avisar(fb ? 'Correção publicada com o feedback. O aluno já pode ver.' : 'Correção salva. O aluno já pode ver a nota e o comentário.');
      });
    });
    $('mt-fb').addEventListener('click', (ev) => {
      if (ev.target.id === 'fb-add') { lerFeedbackCorrecao(); tdaEstado.fb.melhorar.push({ trecho: '', correcao: '', explicacao: '' }); renderFeedbackCorrecao(); return; }
      const rem = ev.target.closest('[data-fb-remover]');
      if (rem) { lerFeedbackCorrecao(); tdaEstado.fb.melhorar.splice(Number(rem.dataset.fbRemover), 1); renderFeedbackCorrecao(); }
    });
    $('mt-fb').addEventListener('change', (ev) => {
      const c = ev.target.closest('[data-fb-hab]');
      if (!c) return;
      if (c.checked && document.querySelectorAll('#mt-fb [data-fb-hab]:checked').length > 3) { c.checked = false; avisar('Marque no máximo 3 habilidades.', true); return; }
      document.querySelector(`#mt-fb [data-fb-motivo="${CSS.escape(c.dataset.fbHab)}"]`).hidden = !c.checked;
    });
    $('mt-previa').addEventListener('click', () => {
      if (!tdaEstado.niveis.every((v) => v > 0)) { avisar('Marque um nível em todos os critérios.', true); return; }
      const caixa = $('mt-previa-caixa');
      caixa.innerHTML = caixa.innerHTML ? '' : previaFeedbackAluno();
      if (caixa.innerHTML) caixa.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });
    $('mt-descartar').addEventListener('click', (ev) => {
      if (!confirm('Descartar o rascunho da IA? Você pode corrigir à mão ou pedir outro lote.')) return;
      comBotao(ev.target, async () => {
        tdaEstado.dados = await chamar('profDescartarRascunhoIa', tdaEstado.dados.questionario.id, tdaEstado.emailFb);
        $('modal-tda').close();
        renderTda();
        avisar('Rascunho descartado.');
      });
    });
    $('mt-apagar').addEventListener('click', (ev) => {
      if (!confirm('Apagar a correção? A nota sai da média e o aluno volta a poder editar a entrega.')) return;
      comBotao(ev.target, async () => {
        tdaEstado.dados = await chamar('profApagarCorrecaoTda', tdaEstado.dados.questionario.id, tdaEstado.unidade.alvos.map((m) => m.email));
        $('modal-tda').close();
        renderTda();
        estado.alunos = await chamar('profListarAlunos');
        renderAlunos();
      });
    });
  }
</script>
